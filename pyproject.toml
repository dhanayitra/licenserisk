[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhanayitra-licenserisk"
version = "0.1.0"
description = "通过字符级与结构级特征识别训练数据的引用许可的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dhanayitra" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dhanayitra.github.io"
Repository = "https://github.com/dhanayitra/licenserisk"
Issues = "https://github.com/dhanayitra/licenserisk/issues"

[project.scripts]
licenserisk = "licenserisk:main"

[tool.setuptools]
py-modules = ["licenserisk"]
